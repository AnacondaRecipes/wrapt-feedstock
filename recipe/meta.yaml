{% set name = "wrapt" %}
{% set version = "2.5.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f595bb0185aab3e9dc31950c95d914f56ea8278810c3b928f3426e12ed6d27bc

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools >=62.0
    - wheel
  run:
    - python

# The mypy fixtures compare mypy output byte-for-byte against checked-in .out files,
# which only matches the exact mypy release used upstream. Both cases below differ
# with the mypy shipped in pkgs/main.
# E   AssertionError: Output did not match expected for mypy_function_wrapper_fn_t6.py
# E   AssertionError: Output did not match expected for mypy_patch_function_wrapper_t1.py
{% set deselect_tests = " --deselect=tests/conftest.py::mypy_function_wrapper_fn_t6 --deselect=tests/conftest.py::mypy_patch_function_wrapper_t1" %}
test:
  source_files:
    - tests
  imports:
    - wrapt
  commands:
    - pip check
    - pytest -vv tests {{ deselect_tests }}
  requires:
    - pip
    - pytest
    - mypy

about:
  home: https://github.com/GrahamDumpleton/wrapt
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Module for decorators, wrappers and monkey patching
  description: |
    The aim of the wrapt module is to provide a transparent object proxy for
    Python, which can be used as the basis for the construction of function
    wrappers and decorator functions.
  doc_url: https://wrapt.readthedocs.io
  dev_url: https://github.com/GrahamDumpleton/wrapt

extra:
  recipe-maintainers:
    - jakirkham
    - nehaljwani
    - ocefpaf
